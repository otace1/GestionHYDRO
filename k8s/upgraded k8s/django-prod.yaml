# ---------------------------
# 1) ClusterIssuer for Let's Encrypt (cluster-wide)
# ---------------------------
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: cedric@malabar-group.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# ---------------------------
# 2) Django Deployment
# ---------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestionhydro-deployment
#  namespace: production            # ← remove or change if needed
  labels:
    app: gestionhydro-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gestionhydro-deployment
  template:
    metadata:
      labels:
        app: gestionhydro-deployment
    spec:
      imagePullSecrets:
        - name: otace
      containers:
        - name: django-server
          image: registry.digitalocean.com/otace/gestionhydro-amd64:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: django-deploy-env
          ports:
            - containerPort: 8000
          # Add resource limits when ready:
          # resources:
          #   requests:
          #     cpu: "250m"
          #     memory: "512Mi"
          #   limits:
          #     cpu: "1000m"
          #     memory: "1Gi"
          command:
            - /bin/sh
            - -c
            - gunicorn hydrocarbures.wsgi --bind 0.0.0.0:8000 --worker-tmp-dir /dev/shm

---
# ---------------------------
# 3) Django Service (ClusterIP, internal only)
# ---------------------------
apiVersion: v1
kind: Service
metadata:
  name: django-service
#  namespace: production            # ← same namespace as Deployment
  labels:
    app: gestionhydro
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: gestionhydro-deployment   # MUST match Deployment pod label
  ports:
    - name: http
      protocol: TCP
      port: 80                     # what Ingress will talk to
      targetPort: 8000             # Django/Gunicorn containerPort

---
# ---------------------------
# 4) HTTPS Ingress (nginx + cert-manager)
# ---------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gestionhydro-ingress
#  namespace: production            # ← same namespace as Service
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - staging.trackflow.plus
      secretName: staging-trackflow-plus-tls   # cert-manager will create/populate this
  rules:
    - host: staging.trackflow.plus
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 80