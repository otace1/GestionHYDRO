apiVersion: v1
kind: Pod
metadata:
  name: celery-server
spec:
  containers:
  - name: celery-server
    image: otace1/gestionhydro:latest
    envFrom:
      - configMapRef:
          name: django-configmap
    ports: []
#    - containerPort: 8000
    volumeMounts:
      - name: static-volume
        mountPath: /vol/web/static
      - name: media-volume
        mountPath: /vol/web/media
      - name: db-data
        mountPath: /var/lib/mysql
    command: ["/bin/sh", "-c", "/scripts/entrypoint.sh"]
  volumes:
    - name: static-volume
      persistentVolumeClaim:
        claimName: static-pvc
    - name: media-volume
      persistentVolumeClaim:
        claimName: media-pvc
    - name: db-data
      persistentVolumeClaim:
        claimName: database-pvc



