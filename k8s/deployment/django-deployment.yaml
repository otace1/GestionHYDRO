apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestionhydro-deployment
  labels:
    app: gestionhydro-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gestionhydro-deployment
  template:
    metadata:
      labels:
        app: gestionhydro-deployment
    spec:
      imagePullSecrets:
        - name: otace
#      initContainers:
