##          image: otace1/gestionhydro-amd64:latest
#          image: registry.digitalocean.com/otace/gestionhydro-amd64:latest
#          imagePullPolicy: Always
#          command: [ "sh", "-c", "cp -r assets/img/* /vol/web/media" ]
#          volumeMounts:
#            - name: media-volume
#              mountPath: /vol/web/media
      containers:
        - name: django-server
#          image: otace1/gestionhydro-amd64:latest
          image: registry.digitalocean.com/otace/gestionhydro-amd64:latest
          imagePullPolicy: Always
          envFrom:
#            - configMapRef:
#                name: django-configmap
            - secretRef:
                name: django-deploy-env
          ports:
            - containerPort: 8000
#          volumeMounts:
#            - name: static-volume
#              mountPath: /vol/web/static
#            - name: media-volume
#              mountPath: /vol/web/media
#            - name: db-data
#              mountPath: /var/lib/mysql
          command: [ "/bin/sh", "-c", "gunicorn hydrocarbures.wsgi --bind 0.0.0.0:8000 --worker-tmp-dir /dev/shm" ]
        - name: celery-worker
#          image: otace1/gestionhydro-amd64:latest
          image: registry.digitalocean.com/otace/gestionhydro-amd64:latest
          imagePullPolicy: Always
          envFrom:
            #            - configMapRef:
            #                name: django-configmap
            - secretRef:
                name: django-deploy-env
#          volumeMounts:
#            - name: static-volume
#              mountPath: /vol/web/static
#            - name: media-volume
#              mountPath: /vol/web/media
#            - name: db-data
#              mountPath: /var/lib/mysql
          command: [ "/bin/sh", "-c", "celery -A hydrocarbures worker --loglevel=info" ]
        - name: redis-server
          image: redis
          ports:
            - protocol: TCP
              containerPort: 6379
