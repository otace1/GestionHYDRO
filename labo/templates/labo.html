{% extends 'base_lab_layout.html' %}

{% block dashboard %}
    <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-spinner {
      border: 4px solid rgba(0, 0, 0, 0.3);
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 2s linear infinite;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-left: -20px;
      margin-top: -20px;
      z-index: 9999;
    }
    </style>

    <div id="data-table-wrapper" style="position: relative;">
        <div class="loading-spinner"></div>
          <table id="data-table" class="table table-bordered display responsive" style="width:100%">
            <thead>
              <tr>
                <th>DATE ENTREE</th>
                <th>DATE ECHANT</th>
                <th>ENTREPOT</th>
                <th>PRODUIT</th>
                <th>IMMATRICULATION</th>
                <th>NUM. DOSSIER</th>
                <th>NUM. RE</th>
                <th>ACTION(s)</th>
              </tr>
            </thead>
          </table>
    </div>

<script>
    const csrfToken = '{{ csrf_token }}';
    let dataTable;

    $(document).ready(function () {
        dataTable = $('#data-table').DataTable({
            lengthChange: false, // Display the length change dropdown
            processing: true,
            serverSide: true,
            responsive: true,
            ajax: {
                url: '{% url 'affichageenchantillonResponse' %}',
                type: 'GET',
                // Show the loading spinner during DataTable processing
                // Show the loading spinner during DataTable processing
                beforeSend: function() {
                  $('#data-table-wrapper .loading-spinner').show();
                },
                // Hide the loading spinner after DataTable processing
                complete: function() {
                  $('#data-table-wrapper .loading-spinner').hide();
                }
        },
            columns: [
                { data: 'dateheurecargaison__date' },
                { data: 'entrepot_echantillon__dateechantillonage__date' },
                { data: 'entrepot__nomentrepot' },
                { data: 'produit__nomproduit' },
                { data: 'immatriculation' },
                { data: 'numdos' },
                { data: 'entrepot_echantillon__numrappechauto' },
                { // New column configuration
                    data: 'idcargaison',
                    render: function (data, type, row) {
                        // Include a button to submit the JSON data for the row
                        const submitButton = '<button type="button" class="btn btn-block btn-warning" data-row-id="' + data + '">RECEPTION</button>';
                        return submitButton;
                    }
                }
            ],
        });


        // Handle form submission on button click
        $('#data-table').on('click', '.btn-warning', function () {
            const button = $(this);
            if (button.attr('disabled')) {
                return; // Return if the button is disabled
            }

            const rowId = $(this).data('row-id');
            const idcargaison = rowId;



            // Disable the button and show the loading spinner
            button.attr('disabled', true);
            $('#data-table-wrapper .loading-spinner').show();

            // Include 'idcargaison' in the JSON data to send to the server
            const dataToSend = {
                idcargaison: idcargaison,
            };

            console.log(dataToSend);

            // Send the JSON data to the URL using AJAX
            $.ajax({
                url: "{% url 'reception' %}", // Replace with your actual URL
                type: 'POST',
                data: JSON.stringify(dataToSend), // Send as JSON string
                contentType: 'application/json', // Set content type to JSON
                headers: {
                    'X-CSRFToken': csrfToken, // Set the CSRF token as a request header
                },
                success: function (response) {
                        if (response.success) {
                            var codeLabo = response.codeLabo;
                            alert("CODE LABO: " + codeLabo);
                            $('#data-table-wrapper .loading-spinner').show();
                            dataTable.ajax.reload();
                        } else {
                            alert("An error occurred");
                            $('#data-table-wrapper .loading-spinner').show();
                            dataTable.ajax.reload();
                        }
                        button.attr('disabled', false);
                },

                error: function () {
                    console.log('Erreur');
                    alert("An error occurred");
                    {#$('.btn-warning').attr("disabled", false);#}
                    // Enable the button and hide the loading spinner
                    $('#data-table-wrapper .loading-spinner').show();
                    button.attr('disabled', false);
                    dataTable.ajax.reload();
                }
            });
        });
    });

</script>

{% endblock %}
