name: Django Tests

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["Dockerized"]
  pull_request:
    branches: ["Dockerized"]

concurrency:
  group: django-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_scan:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bandit GitHub Action (recommended by PyCQA)
      - name: Bandit by PyCQA
        uses: PyCQA/bandit-action@v1.0.1
        with:
          # Recursive scan of repository
          targets: "."
          # -ll = medium/high only
          # -r  = recursive (targets="." already, but keep for clarity)
          # -x  = exclude paths
          # --skip B101 example (optional) if you want to ignore assert usage
          options: >-
            -r
            -ll
            -x ./tests,./venv,./.venv,./migrations,./staticfiles,./staticfiles-cdn,./static,./assets,./node_modules,./media