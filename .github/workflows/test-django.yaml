name: Django Tests

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["Dockerized"]
  pull_request:
    branches: ["Dockerized"]

concurrency:
  group: django-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DEBUG: "0"
      DEVELOPMENT_MODE: "1"
      DJANGO_SECRET_KEY: "ci-test-key-not-for-prod"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_HOST: "127.0.0.1"
      DATABASE_PORT: "3306"
      DATABASE_NAME: "hydro"
      DATABASE_USER: "root"
      DATABASE_PASSWORD: "password"
      CELERY_BROKER: "redis://127.0.0.1:6379/0"

    services:
      mysql:
        image: mysql:8.3
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: hydro
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Django makemigrations
        run: python manage.py makemigrations --noinput

      - name: Django migrate
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Bandit
        run: pip install bandit

      - name: Bandit Scan
        # -r: recursive, -ll: medium/high severity, -x: exclude directories
        run: bandit -r . -ll -x ./tests,./venv,./migrations,./staticfiles,./staticfiles-cdn,./static,./assets
