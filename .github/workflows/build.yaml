name: Build Docker Container & Push to DO registry

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["Dockerized"]
  pull_request:
    branches: ["Dockerized"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency review on PRs to catch vulnerable or malicious packages early
  dependency_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  test_django_job:
    uses: otace1/GestionHYDRO/.github/workflows/test-django.yaml@Dockerized

  build:
    runs-on: ubuntu-latest
    needs: [test_django_job]

    env:
      CLUSTER_NAME: k8s-gestionhydro
      REGISTRY: registry.digitalocean.com/otace
      IMAGE_NAME: gestionhydro-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install DOCTL
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN_KEY }}

      - name: Login to DO Container registry (short-lived)
        run: doctl registry login --expiry-seconds 1200

      - name: Build container image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f Dockerfile \
            -t $REGISTRY/$IMAGE_NAME:latest \
            -t $REGISTRY/$IMAGE_NAME:${GITHUB_SHA::7} \
            .

      - name: Prepare reports directory
        run: |
          mkdir -p security-reports

      # ---------------- Security: Scan filesystem before push (Trivy FS) ----------------
      - name: Vulnerability scan (Trivy filesystem)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'security-reports/trivy-fs.sarif'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # ---------------- Security: Scan the built image before pushing ----------------
      - name: Vulnerability scan (Trivy image)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'security-reports/trivy-image.sarif'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push image to DO
        run: |
          set -euo pipefail
          docker push $REGISTRY/$IMAGE_NAME --all-tags

      - name: Fetch kubeconfig (short-lived)
        run: |
          set -euo pipefail
          doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ env.CLUSTER_NAME }}

      # ============================================================
      # ✅ Secret update: match your Kubernetes Secret stringData keys
      # ============================================================
      - name: Apply deployment secret (django-deploy-env)
        run: |
          set -euo pipefail

          kubectl create secret generic django-deploy-env \
            --from-literal=DEBUG="0" \
            --from-literal=DEVELOPMENT_MODE="0" \
            --from-literal=DJANGO_SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
            --from-literal=ALLOWED_HOSTS="trackflow.plus" \
            --from-literal=CELERY_BROKER="${{ secrets.CELERY_BROKER }}" \
            --from-literal=DATABASE_HOST="${{ secrets.DATABASE_HOST }}" \
            --from-literal=DATABASE_NAME="${{ secrets.DATABASE_NAME }}" \
            --from-literal=DATABASE_USER="${{ secrets.DATABASE_USER }}" \
            --from-literal=DATABASE_PASSWORD="${{ secrets.DATABASE_PASSWORD }}" \
            --from-literal=DATABASE_PORT="25060" \
            --from-literal=DB_IGNORE_SSL="True" \
            --from-literal=CSRF_TRUSTED_ORIGINS="https://trackflow.plus" \
            --from-literal=SPACE_SECRET="${{ secrets.SPACE_SECRET }}" \
            --from-literal=SPACE_ACCESS_KEY="${{ secrets.SPACE_ACCESS_KEY }}" \
            --from-literal=SPACE_REGION="sfo3" \
            --from-literal=SPACE_ENDPOINT="digitaloceanspaces.com" \
            --from-literal=SERVICE_NAME="s3" \
            --from-literal=SPACE_NAME="gestionhydro" \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=DELETE_CONFIRMATION_CODE="${{ secrets.DELETE_CONFIRMATION_CODE }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update deployment image (django-server)
        run: |
          set -euo pipefail
          kubectl set image deployment/gestionhydro-deployment \
            django-server=$REGISTRY/$IMAGE_NAME:${GITHUB_SHA::7}

      - name: Update deployment image (celery-worker)
        run: |
          set -euo pipefail
          kubectl set image deployment/gestionhydro-celery \
            celery-worker=$REGISTRY/$IMAGE_NAME:${GITHUB_SHA::7}

      - name: Wait for rollout to finish
        run: |
          set -euo pipefail
          kubectl rollout status deployment/gestionhydro-deployment --timeout=300s
          kubectl rollout status deployment/gestionhydro-celery --timeout=300s

      # ---------------- Aggregate & Publish HTML report (always) ----------------
      - name: Generate HTML security report
        if: always()
        run: |
          REPORT_DIR="security-reports"
          INDEX="$REPORT_DIR/index.html"
          mkdir -p "$REPORT_DIR"
          echo "<!doctype html><html><head><meta charset=\"utf-8\"><title>Security Report</title>"> > "$INDEX"
          echo "<style>body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:24px;max-width:980px;margin:auto} h1{margin-top:0} code{background:#f6f8fa;padding:2px 4px;border-radius:4px} .card{border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin:12px 0} .list a{display:block;margin:6px 0}</style></head><body>" >> "$INDEX"
          echo "<h1>CI Security Report</h1>" >> "$INDEX"
          echo "<p>Commit: <code>${GITHUB_SHA}</code> • Workflow: Build Docker Container & Push</p>" >> "$INDEX"
          echo "<div class=\"card\"><h2>Artifacts</h2><div class=\"list\">" >> "$INDEX"
          for f in trivy-fs.sarif trivy-image.sarif; do
            if [ -f "$REPORT_DIR/$f" ]; then
              echo "<a href=\"$f\" download>$f</a>" >> "$INDEX"
            fi
          done
          echo "</div></div>" >> "$INDEX"
          echo "<p>Tip: Open SARIF files in GitHub code scanning or VS Code SARIF viewer.</p>" >> "$INDEX"
          echo "</body></html>" >> "$INDEX"

      - name: Upload HTML Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-security-report-${{ github.sha }}
          path: security-reports
          if-no-files-found: warn

      - name: Run migrate + collectstatic inside one pod
        run: |
          set -euo pipefail
          POD_NAME=$(kubectl get pod -l app=gestionhydro-deployment -o jsonpath="{.items[0].metadata.name}")
          kubectl exec "$POD_NAME" -- bash /app/scripts/migration.sh
          kubectl exec "$POD_NAME" -- bash /app/scripts/collectstatic.sh
