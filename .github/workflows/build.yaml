name: Build Docker Container & Push to DO registry

on:
  workflow_call:
  workflow_dispatch:

  push:
    branches: [ "Dockerized" ]
  pull_request:
    branches: [ "Dockerized" ]

jobs:
  test_django_job:
    uses: otace1/GestionHYDRO/.github/workflows/test-django.yaml@Dockerized
  docker_build:
    runs-on: ubuntu-latest
    needs: [test_django_job]

    env:
      DJANGO_SECRET_KEY: this-is-a-test-key-for-this-deployment
    steps:
    - uses: actions/checkout@v4

        
        
