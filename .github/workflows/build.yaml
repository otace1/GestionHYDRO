name: Build & Test (Staging/Dev)

# =============================================================================
# STAGING/DEVELOPMENT BUILD WORKFLOW
# =============================================================================
# This workflow runs on:
# - Push to Dockerized branch (staging/dev)
# - Pull requests to Dockerized
#
# It does NOT deploy to production.
# For production deployment, merge to 'main' branch.
# =============================================================================

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["Dockerized"]
  pull_request:
    branches: ["Dockerized"]

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_django_job:
    uses: ./.github/workflows/test-django.yaml

  build:
    needs: [test_django_job]
    runs-on: ubuntu-latest

    env:
      CLUSTER_NAME: k8s-gestionhydro
      REGISTRY: registry.digitalocean.com/otace
      IMAGE_NAME: gestionhydro-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install DOCTL
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN_KEY }}

      - name: Login to DO Container registry (short-lived)
        run: doctl registry login --expiry-seconds 1200

      - name: Build container image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f Dockerfile \
            -t $REGISTRY/$IMAGE_NAME:staging-latest \
            -t $REGISTRY/$IMAGE_NAME:staging-${GITHUB_SHA::7} \
            .

      - name: Push image to DO (staging tags only)
        run: |
          set -euo pipefail
          docker push $REGISTRY/$IMAGE_NAME:staging-latest
          docker push $REGISTRY/$IMAGE_NAME:staging-${GITHUB_SHA::7}

      - name: Build summary
        run: |
          echo "=============================================="
          echo "✅ STAGING BUILD SUCCESSFUL"
          echo "=============================================="
          echo "Image: $REGISTRY/$IMAGE_NAME:staging-${GITHUB_SHA::7}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo ""
          echo "⚠️  This is a STAGING build. NOT deployed to production."
          echo "To deploy to production, merge to 'main' branch."
          echo "=============================================="
