name: Build Docker Container & Push to DO registry

on:
  workflow_call:
  workflow_dispatch:

  push:
    branches: [ "Dockerized" ]
  pull_request:
    branches: [ "Dockerized" ]

jobs:
  test_django_job:
    uses: otace1/GestionHYDRO/.github/workflows/test-django.yaml@Dockerized
  build:
    runs-on: ubuntu-latest
    needs: [test_django_job]

    env:
      DJANGO_SECRET_KEY: this-is-a-test-key-for-this-deployment
      CLUSTER_NAME: k8s-gestionhydro
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install DOCTL
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN_KEY }}
      - name: Login to Do Container registry with short-lived creds
        run: doctl registry login --expiry-seconds 1200
      - name: Build container image
        working-directory: .
        run: |
          docker build --platform linux/amd64 -f Dockerfile \
            -t registry.digitalocean.com/otace/gestionhydro-amd64:latest \
            -t registry.digitalocean.com/otace/gestionhydro-amd64:${GITHUB_SHA::7} \
            .
      - name: Push Image to DO
        run: |
          docker push registry.digitalocean.com/otace/gestionhydro-amd64 --all-tags
      - name: K8s cluster KubeConfig File with short-lived creds
        run: |
          doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ env.CLUSTER_NAME }}
      - name: Update deployment secrets
        run: |
          cat << EOF >> prod.env
          DEBUG=0
          DEVELOPMENT_MODE=0
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS=localhost,127.0.0.1,django-server,suivicargo.com,trackflow.plus
          CELERY_BROKER=redis://redis-service:6379/0
          DATABASE_HOST=${{ secrets.DATABASE_HOST }}
          DATABASE_NAME=${{ secrets.DATABASE_NAME }}
          DATABASE_USER=${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT=25060
          DB_IGNORE_SSL=True
          SPACE_SECRET=${{ secrets.SPACE_SECRET }}
          SPACE_ACCESS_KEY=${{ secrets.SPACE_ACCESS_KEY }}
          SPACE_REGION=sfo3
          SPACE_ENDPOINT=digitaloceanspaces.com
          SERVICE_NAME=s3
          SPACE_NAME=gestionhydro
          EOF
          kubectl delete secret django-deploy-env
          kubectl create secret generic django-deploy-env --from-env-file=prod.env
      - name: Update deployment image
        run: |
          kubectl set image deployment/gestionhydro-deployment \
            django-server=registry.digitalocean.com/otace/gestionhydro-amd64:${GITHUB_SHA::7} \
            celery-worker=registry.digitalocean.com/otace/gestionhydro-amd64:${GITHUB_SHA::7} \
            redis-server=redis:latest
      - name: Wait for rollout to finish
        run: |
          kubectl rollout status deployment/gestionhydro-deployment
      - name: Migrate database command
        run: |
          export SINGLE_POD_NAME=$(kubectl get pod -l app=gestionhydro-deployment -o jsonpath="{.items[0].metadata.name}") 
          kubectl exec -it $SINGLE_POD_NAME -- bash /app/scripts/migration.sh
    

        
        
