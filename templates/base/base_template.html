{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>TrackFlow +</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

<script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome (icons for the sidebar) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4cc9f0',
            primary2: '#00f5d4',
            success: '#19c37d',
            danger:  '#ef476f',
            warning: '#ffd166',
            textc:  '#e9eefc',
            muted:  '#aab3c7',
          },
          boxShadow: {
            glass: '0 18px 50px rgba(0,0,0,.25)',
            glassHover: '0 24px 60px rgba(0,0,0,.30)',
          },
          keyframes: {
            gradientShift: { '0%': {backgroundPosition:'0% 50%'}, '50%': {backgroundPosition:'100% 50%'}, '100%': {backgroundPosition:'0% 50%'} },
            floatUp: { '0%': { transform:'translateY(6px)', opacity:0 }, '100%': { transform:'translateY(0)', opacity:1 } },
            shimmerMove: { '100%': { transform:'translateX(100%)' } }
          },
          animation: {
            gradientShift: 'gradientShift 9s ease infinite',
            floatUp: 'floatUp .5s ease both',
            shimmerMove: 'shimmerMove 2.2s ease-in-out infinite',
          }
        }
      }
    }
  </script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-grad: radial-gradient(1200px 900px at 10% -10%, rgba(0, 245, 212, .08), transparent 60%),
            radial-gradient(900px 700px at 120% 120%, rgba(76, 201, 240, .08), transparent 60%),
            linear-gradient(160deg, #0a0f1e, #0f1632 70%);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Helvetica Neue", sans-serif;
            background: var(--bg-grad);
            color: #e9eefc;
            overflow-x: hidden;
        }

        .glass {
            background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .03));
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(8px);
        }

        .shimmer:before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, .08) 25%, transparent 55%);
            transform: translateX(-100%);
            animation: shimmerMove 2.2s ease-in-out infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            .shimmer:before {
                animation: none;
            }

            [style*="gradientShift"], .animate-floatUp {
                animation: none !important;
            }
        }
    </style>
</head>

<body class="min-h-screen">
<div class="flex min-h-screen">
    <!-- Sidebar -->
    {% include 'menus/side-menu/main-menu.html' %}
    <!-- Main column -->
    <div class="flex-1 flex flex-col">
        <!-- Top bar -->
        {% include 'menus/navbar/navbar.html' %}
        {% block breadcrumb %}{% endblock %}

        <!-- CONTENT -->
        <main class="flex-1 w-full">
            <div class="w-full px-3 sm:px-4 lg:px-6 xl:px-8 py-4 sm:py-6">
                {% block main_content %}
                {% endblock %}
            </div>
        </main>

        {% include 'menus/footer/footer.html' %}
    </div>
</div>


<!-- Page scripts -->
<script>
    // Sidebar toggle (if your sidebar include exposes #sidebar)
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    if (sidebarToggle && sidebar) {
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('absolute');
            sidebar.classList.toggle('inset-y-0');
            sidebar.classList.toggle('z-50');
            sidebar.classList.toggle('left-0');
            document.body.style.overflow = sidebar.classList.contains('absolute') ? 'hidden' : '';
        });
    }
</script>
</body>
</html>
