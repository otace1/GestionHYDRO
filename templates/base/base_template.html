{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>TrackFlow +</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4cc9f0',
            primary2: '#00f5d4',
            muted: '#aab3c7'
          },
          boxShadow: {
            glass: '0 18px 50px rgba(0,0,0,.25)'
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg-grad:
        radial-gradient(1400px 900px at 10% -10%, rgba(0,245,212,.08), transparent 60%),
        radial-gradient(1200px 800px at 120% 120%, rgba(76,201,240,.08), transparent 60%),
        linear-gradient(160deg, #0a0f1e, #0f1632 70%);
    }

    html, body { height: 100%; }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg-grad);
      color: #e9eefc;
      overflow-x: hidden;
    }

    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }

    /* Mobile sidebar backdrop */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.65);
      backdrop-filter: blur(6px);
      z-index: 40;
      display: none;
    }
    .sidebar-backdrop.show { display: block; }
  </style>
</head>

<body class="min-h-screen">

<!-- Backdrop -->
<div id="sidebarBackdrop" class="sidebar-backdrop"></div>

<div class="flex min-h-screen w-full">

  <!-- Sidebar -->
  {% include 'menus/side-menu/main-menu.html' %}

  <!-- MAIN COLUMN -->
  <div class="flex-1 min-w-0 flex flex-col">

    <!-- Top navbar -->
    {% include 'menus/navbar/navbar.html' %}
    {% block breadcrumb %}{% endblock %}

    <!-- MAIN CONTENT -->
    <main class="flex-1 w-full min-w-0 overflow-x-hidden">
      <div
        class="
          w-full
          px-3 sm:px-4 md:px-6 lg:px-8
          xl:px-12
          2xl:px-16
          3xl:px-20
          py-4 sm:py-6
        "
      >
        {% block main_content %}{% endblock %}
      </div>
    </main>

    <!-- Footer -->
    {% include 'menus/footer/footer.html' %}
  </div>
</div>

<!-- Responsive Sidebar Logic -->
<script>
  const sidebar = document.getElementById('sidebar');
  const toggle = document.getElementById('sidebarToggle');
  const backdrop = document.getElementById('sidebarBackdrop');

  function isDesktop() {
    return window.matchMedia('(min-width: 1024px)').matches;
  }

  function openSidebar() {
    sidebar.classList.remove('hidden');
    sidebar.classList.add('fixed','left-0','top-0','h-full','z-50');
    backdrop.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeSidebar() {
    if (!isDesktop()) sidebar.classList.add('hidden');
    sidebar.classList.remove('fixed','left-0','top-0','h-full','z-50');
    backdrop.classList.remove('show');
    document.body.style.overflow = '';
  }

  function sync() {
    if (isDesktop()) {
      sidebar.classList.remove('hidden','fixed','z-50');
      backdrop.classList.remove('show');
      document.body.style.overflow = '';
    } else {
      sidebar.classList.add('hidden');
    }
  }

  toggle?.addEventListener('click', () => {
    sidebar.classList.contains('hidden') ? openSidebar() : closeSidebar();
  });

  backdrop?.addEventListener('click', closeSidebar);
  window.addEventListener('resize', sync);
  document.addEventListener('keydown', e => e.key === 'Escape' && closeSidebar());

  sync();
</script>

</body>
</html>
