version: "3.8"

services:

  redis:
    container_name: redis-service
    image: redis:7
    restart: always

  db:
    container_name: database-service
    image: mysql:8.3.0
    restart: always
    env_file:
      - .env
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD" ]
      timeout: 20s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql   # Mount a volume for MySQL data persistence

  app:
    container_name: django-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app/
#      - static-data:/vol/web/static
#      - media-data:/vol/web/media
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      - DJANGO_ENV=development
    depends_on:
      - db

  celery:
    restart: unless-stopped
    container_name: celery-worker
    build:
      context: .
      dockerfile: Dockerfile.dev
    entrypoint: /scripts/worker-entrypoint.sh
    volumes:
      - .:/app/
#      - static-data:/vol/web/static
#      - media-data:/vol/web/media
    env_file:
      - .env
    environment:
      - DJANGO_ENV=development
    depends_on:
      - app
      - redis

  flower:
    restart: unless-stopped
    container_name: flower-service
    image: mher/flower
    command: celery --broker=redis://redis:6379 flower
    ports:
      - 5555:5555
    depends_on:
      - redis

#  proxy:
