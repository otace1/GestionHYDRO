{% extends 'entrepot/tableauRapport.html' %}
{% load django_tables2 %}
{% load crispy_forms_tags %}


{% block content %}

<!-- Barre de recherche multi-critères -->
<div class="row mb-4">
  <div class="col-md-12">
    <div class="input-group shadow-sm">
      <div class="input-group-prepend">
        <span class="input-group-text bg-primary text-white border-primary">
          <i class="fas fa-qrcode"></i>
        </span>
      </div>
      <input type="text" id="qrSearch" class="form-control border-primary" 
             placeholder="Scanner le QRCode..." autofocus>
      
      <div class="input-group-prepend ml-md-2">
        <span class="input-group-text bg-info text-white border-info">
          <i class="fas fa-search"></i>
        </span>
      </div>
      <input type="text" id="filterSearch" class="form-control border-info" 
             placeholder="Immatriculation, Num Dossier ou Déclaration..." style="min-width: 300px;">

      <div class="input-group-append">
        <button class="btn btn-primary" id="btnSearch">
          <i class="fas fa-filter mr-1"></i> Filtrer
        </button>
      </div>
    </div>
  </div>
</div>

<div id="data-table-wrapper" style="position: relative; overflow-x: auto;">
  <div class="loading-spinner"></div>
  <table id="data-table" class="table table-bordered display responsive" style="width: 100%; border-collapse: collapse;">
    <thead>
      <tr>
        <th>DATE ENTREE</th>
        <th>FOURNISSEUR</th>
        <th>ENTREPOT</th>
        <th>IMMATRICULATION</th>
        <th>PRODUIT</th>
        <th>#.T1D</th>
        <th>#.DOSSIER</th>
        <th>DATE ECH.</th>
        <th>DATE REC.LABO</th>
        <th>DATE RESULT.</th>
        <th>DATE INSPECTION</th>
        <th>VOL.DECL</th>
        <th>GOV JAUGE</th>
        <th>GSV</th>
      </tr>
    </thead>
    <tbody>
      <!-- Add your table rows here -->
    </tbody>
  </table>
</div>

<!-- Include FileSaver.js library for saving the Excel file -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
const csrfToken = '{{ csrf_token }}';

$(document).ready(function () {
    var dataTable = $('#data-table').DataTable({
        lengthChange: false, // Disable the length change dropdown
        processing: true,    // Show the processing indicator
        serverSide: true,    // Enable server-side processing
        responsive: true,    // Enable responsive features
        pageLength: 10,
        ajax: {
            url: '{% url 'responseTableauRapports' %}', // Backend URL for data
            type: 'GET',
            data: function(d) {
                d.q = $('#qrSearch').val();
                d.f = $('#filterSearch').val();
            },
            beforeSend: function() {
                $('#data-table-wrapper .loading-spinner').show(); // Show spinner before processing
            },
            complete: function() {
                $('#data-table-wrapper .loading-spinner').hide(); // Hide spinner after processing
            }
        },
        columns: [
            { data: 'dateheurecargaison__date' },
            { data: 'importateur__nomimportateur' },
            { data: 'entrepot__nomentrepot' },
            { data: 'immatriculation' },
            { data: 'produit__nomproduit' },
            { data: 'declaration' },
            { data: 'numdos' },
            { data: 'entrepot_echantillon__dateechantillonage' },
            { data: 'entrepot_echantillon__laboreception__datereceptionlabo' },
            { data: 'impressionresultat__printDate' },
            { data: 'inspection__dateinspection' },
            { data: 'volume' },
            { data: 'volConst' },
            { data: 'gsvT' },
        ],
        dom: 'Bfrtip', // Add export buttons (including the Excel button)
        buttons: [
            {
                extend: 'excelHtml5',
                text: 'Export to Excel',        // Button text
                filename: 'rapport_brut',       // Excel file name
                exportOptions: {
                    columns: ':visible',       // Export visible columns only
                    modifier: {
                        search: 'none'         // Export all rows, ignoring filters
                    }
                },
                action: function (e, dt, node, config) {
                    // Redirect to the export URL with the proper parameters
                    window.location.href = '{% url 'exportBrutJournalier' %}?export=excel';
                }
            }
        ],
    });

    // Search trigger
    $('#btnSearch').click(function() {
        dataTable.ajax.reload();
    });
    $('#qrSearch, #filterSearch').keypress(function(e) {
        if(e.which == 13) {
            dataTable.ajax.reload();
        }
    });
});
</script>

{% endblock %}
