{% extends 'entrepot/tableauRapport.html' %}
{% load django_tables2 %}
{% load crispy_forms_tags %}


{% block content %}
<div id="data-table-wrapper" style="position: relative;">
  <div class="loading-spinner"></div>
<table id="data-table" class="table table-bordered display responsive" style="width:100%">
    <thead>
        <tr>
            <th>DATE ENTREE</th>
            <th>FOURNISSEUR</th>
            <th>ENTREPOT</th>
            <th>IMMATRICULATION</th>
            <th>PRODUIT</th>
            <th>#.T1D</th>
            <th>#.DOSSIER</th>
            <th>DATE ECH.</th>
            <th>DATE REC.LABO</th>
            <th>DATE RESULT.</th>
            <th>DATE INSPECTION</th>
            <th>VOL.DECL</th>
            <th>GOV JAUGE</th>
            <th>GSV</th>
        </tr>
    </thead>
</table>
</div>

<!-- Include FileSaver.js library for saving the Excel file -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
    const csrfToken = '{{ csrf_token }}';

    $(document).ready(function () {
        var dataTable = $('#data-table').DataTable({
            lengthChange: false, // Display the length change dropdown
            processing: true,
            serverSide: true,
            responsive: true,
            ajax: {
                url: '{% url 'responseTableauRapports' %}',
                type: 'GET',
                // Show the loading spinner during DataTable processing
                // Show the loading spinner during DataTable processing
                beforeSend: function() {
                  $('#data-table-wrapper .loading-spinner').show();
                },
                // Hide the loading spinner after DataTable processing
                complete: function() {
                  $('#data-table-wrapper .loading-spinner').hide();
                }
        },
            columns: [
                { data: 'dateheurecargaison__date' },
                { data: 'importateur__nomimportateur' },
                { data: 'entrepot__nomentrepot' },
                { data: 'immatriculation' },
                { data: 'produit__nomproduit' },
                { data: 'declaration' },
                { data: 'numdos' },
                { data: 'entrepot_echantillon__dateechantillonage' },
                { data: 'entrepot_echantillon__laboreception__datereceptionlabo' },
                { data: 'impressionresultat__printDate' },
                { data: 'inspection__dateinspection' },
                { data: 'volume' },
                { data: 'volConst' },
                { data: 'gsvT' },

            ],
            // Optional: Add buttons for exporting to Excel
            dom: 'Bfrtip',
            buttons: [
                {
                    extend: 'excelHtml5',
                    text: 'Export to Excel',
                    filename: 'rapport_brut',
                    exportOptions: {
                        modifier: {
                            search: 'none'
                        }
                    },
                    action: function (e, dt, node, config) {
                        // Redirect to the export URL instead of using AJAX
                        window.location.href = '{% url 'exportBrutJournalier' %}?export=excel';
                    }
                }
            ],
        });


    });
</script>

{% endblock %}
