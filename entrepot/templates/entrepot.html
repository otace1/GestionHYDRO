<script>
    {% block javascript %}
        function getRowId(button) {
          var row = button.closest('tr');

          if (row) {
            rowId = row.id;
            console.log('Row ID:', rowId);
            // Perform further actions with the row ID, such as making an AJAX request
          }
        }


        // using jQuery
        function getCookie(name) {
            var cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                var cookies = document.cookie.split(';');
                for (var i = 0; i < cookies.length; i++) {
                    var cookie = jQuery.trim(cookies[i]);
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        var csrftoken = getCookie('csrftoken');

        function csrfSafeMethod(method) {
            // these HTTP methods do not require CSRF protection
            return (/^(GET|HEAD|OPTIONS|TRACE)$/.test(method));
        }
        $.ajaxSetup({
            beforeSend: function (xhr, settings) {
        if (!csrfSafeMethod(settings.type) && !this.crossDomain) {
            xhr.setRequestHeader("X-CSRFToken", csrftoken);
        }
    }
});

        //script for submitting data in ajax
        $('.btn.btn-default').click(function () {
            Id = rowId; //getting the id of the row which equal to the pk into the database
            console.log(Id); // debug
        });

        $('.btn.btn-success').click(function (e) {
            e.preventDefault()

            //Disable Submit button
            $('.btn.btn-success').attr("disabled", true);
            var pk = Id;
            var APIurl = '/entrepot/echantillonage/';
         $input = $('<input type="hidden" name="pk">').val(pk);
         $('#sampling-form').append($input);
         var SerializedData = $("#sampling-form").serialize();
         console.log(SerializedData);
         $.ajax({
    url: APIurl,
    type: "POST",
    data: SerializedData,
    dataType: 'json',

    success: function (response) {
        alert("Données sauvegardées");

        // Decode the PDF content from the response
        var pdfContent = atob(response.pdf_base64);

        // Create a Blob object from the decoded PDF content
        var pdfBlob = new Blob([pdfContent], { type: 'application/pdf' });

        // Create a URL for the Blob object
        var pdfURL = URL.createObjectURL(pdfBlob);

        // Open the PDF in a new browser window
        window.open(pdfURL);

        location.reload();
    },

    error: function () {
        console.log('Erreur');
        alert("An error occurred");
        $('.btn.btn-success').attr("disabled", false);
        location.reload();
    }
});

        })

    {% endblock %}
</script>
