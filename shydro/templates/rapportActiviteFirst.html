{% extends 'shydro/rapportActivite.html' %}
{% load crispy_forms_tags %}
{% load django_tables2 %}
{% load bootstrap4 %}
{% bootstrap_css %}
{% bootstrap_javascript jquery='full' %}

<style>
/* ONE GLOBAL SPINNER ONLY */
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

#global-spinner {
  display: none; /* hidden by default */
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.6);
  z-index: 9999;
}

#global-spinner .loading-spinner {
  border: 4px solid rgba(0, 0, 0, 0.3);
  border-top: 4px solid #3498db;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 1s linear infinite;
  position: absolute;
  top: 50%;
  left: 50%;
  margin-left: -25px;
  margin-top: -25px;
}
</style>





{% block content %}

{#    <!-- GLOBAL SPINNER (ONLY ONE) -->#}
{#<div id="global-spinner">#}
{#  <div class="loading-spinner"></div>#}
{#</div>#}


{{ block.super }}

<script>
const csrfToken = '{{ csrf_token }}';

// SHOW / HIDE GLOBAL SPINNER
function showSpinner() {
    document.getElementById("global-spinner").style.display = "block";
}
function hideSpinner() {
    document.getElementById("global-spinner").style.display = "none";
}

// ----- EXISTING ACTIONS (just add showSpinner/hideSpinner) -----

function confirmAction() {
    event.preventDefault();
    const row = event.target.closest('tr');
    const rowId = row.getAttribute('id');

    const confirmed = confirm('Êtes-vous sûr de vouloir réinspecter cette cargaison?');
    if (!confirmed) return false;

    showSpinner();

    fetch('{% url "reInspecter" %}', {
        method: 'POST',
        body: JSON.stringify({ rowId }),
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }
    })
    .then(response => {
        hideSpinner();
        if (response.ok) {
            alert('Cargaison renvoyée en inspection');
            location.reload();
        } else {
            alert('Erreur lors de la réinspection.');
            location.reload();
        }
    })
    .catch(error => {
        hideSpinner();
        console.error(error);
    });

    return false;
}


function printRappEchantillonnage() {
    event.preventDefault();
    const row = event.target.closest('tr');
    const rowId = row.getAttribute('id');

    if (!confirm("Afficher le rapport d'Echantillonnage?")) return false;

    showSpinner();

    fetch('{% url "impressionRappEch" %}', {
        method: 'POST',
        body: JSON.stringify({ rowId }),
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }
    })
    .then(r => r.json())
    .then(data => {
        hideSpinner();
        if (data.status === 'success') {
            const pdfBlob = new Blob([atob(data.pdf_base64)], { type: 'application/pdf' });
            window.open(URL.createObjectURL(pdfBlob));
            location.reload();
        } else {
            alert("Éléments du rapport manquants.");
            location.reload();
        }
    })
    .catch(error => {
        hideSpinner();
        console.error(error);
    });

    return false;
}


function printRappInspection() {
    event.preventDefault();
    const row = event.target.closest('tr');
    const rowId = row.getAttribute('id');

    if (!confirm("Afficher le rapport d'Inspection?")) return false;

    showSpinner();

    fetch('{% url "impressionRappInsp" %}', {
        method: 'POST',
        body: JSON.stringify({ rowId }),
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }
    })
    .then(r => r.json())
    .then(data => {
        hideSpinner();
        if (data.status === 'success') {
            const pdfBlob = new Blob([atob(data.pdf_base64)], { type: 'application/pdf' });
            window.open(URL.createObjectURL(pdfBlob));
            location.reload();
        } else {
            alert("Rapport d'inspection incomplet.");
            location.reload();
        }
    })
    .catch(error => {
        hideSpinner();
        console.error(error);
    });

    return false;
}


function printDossimport() {
    event.preventDefault();
    const row = event.target.closest('tr');
    const rowId = row.getAttribute('id');

    if (!confirm("Afficher les éléments du dossier?")) return false;

    showSpinner();

    fetch('{% url "afficherDossImport" %}', {
        method: 'POST',
        body: JSON.stringify({ rowId }),
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }
    })
    .then(r => r.blob())
    .then(blob => {
        hideSpinner();
        const url = URL.createObjectURL(blob);
        const link = Object.assign(document.createElement('a'), {
            href: url,
            download: "file.pdf"
        });
        document.body.appendChild(link);
        link.click();
        link.remove();
        location.reload();
    })
    .catch(error => {
        hideSpinner();
        console.error(error);
        alert("Erreur lors du téléchargement.");
    });

    return false;
}

</script>

{% endblock %}
