{% extends 'accounts/login_layout.html' %}


{% block login %}

    <style>
  .btn-animate {
    transition: transform 0.3s ease;
  }

  .btn-animate:hover {
    transform: scale(1.1);
  }
</style>

<form method="post">
  {% csrf_token %}
  {% if next %}
    <input type="hidden" name="next" value="{{ next }}"/>
  {% endif %}
  <div class="form-group has-feedback">
    <input type="text" id="username" name="username" class="form-control" placeholder="Nom d'utilisateur">
    <span class="glyphicon glyphicon-user form-control-feedback"></span>
  </div>
  <div class="form-group has-feedback">
    <input type="password" id="password" name="password" class="form-control" placeholder="Mot de passe">
    <span class="glyphicon glyphicon-lock form-control-feedback"></span>
  </div>
  <div class="row justify-content-center">
    <div class="col-md-6">
      <button type="submit" class="btn btn-primary btn-block btn-flat btn-animate">Connexion</button>
    </div>
  </div>
</form>



{% endblock %}
