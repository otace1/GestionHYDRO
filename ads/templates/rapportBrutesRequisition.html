{% extends 'base/base_template.html' %}
{% load static %}

{% block main_content %}
  <!-- Back button -->
  <div class="mb-4">
    <a href="{% url 'dashboard' %}"
       class="group inline-flex items-center gap-3 px-3.5 py-2.5 rounded-xl
              border border-white/10 bg-white/5 hover:bg-white/10
              text-sm font-semibold text-white/90 shadow-glass
              focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40
              transition"
       title="Revenir au tableau de bord" aria-label="Revenir au tableau de bord">
      <span class="h-7 w-7 grid place-items-center rounded-lg bg-primary/15 text-primary group-hover:bg-primary/20 transition">
        <i class="fa-solid fa-arrow-left text-[13px]"></i>
      </span>
      <span>Retour au tableau de bord</span>
    </a>
  </div>

  <!-- Card -->
  <section class="glass rounded-2xl shadow-glass border border-white/10 overflow-hidden">
    <!-- Header -->
    <header class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3 px-4 sm:px-5 py-4 border-b border-white/10">
      <div>
        <h2 class="text-lg sm:text-xl font-semibold">Rapport brut — En attente de réquisition</h2>
        <p class="text-sm text-white/70">Entrées déclarées, filtrables et exportables.</p>
      </div>

      <div class="flex flex-col sm:flex-row gap-2 sm:items-center">
        <!-- Column toggles (desktop only) -->
        <div class="relative hidden sm:block">
          <button id="colToggleBtn"
                  class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-sm bg-white/10 hover:bg-white/15 transition">
            <i class="fa-solid fa-table-columns text-white/80"></i>
            Colonnes
            <i class="fa-solid fa-chevron-down text-xs opacity-70"></i>
          </button>
          <div id="colToggleMenu"
               class="hidden absolute right-0 mt-2 w-56 glass rounded-xl border border-white/10 shadow-glass p-2 text-sm z-10"></div>
        </div>

        <!-- Search -->
        <label class="relative w-full sm:w-auto">
          <span class="sr-only">Rechercher</span>
          <input id="dt-search" type="search" placeholder="Rechercher…"
                 class="w-full sm:w-64 glass rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 placeholder:text-white/50" />
          <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-white/60" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="11" cy="11" r="8" stroke-width="2"></circle>
            <path d="M21 21l-4.3-4.3" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </label>

        <!-- Page size -->
        <label class="text-sm flex items-center gap-2">
          <span class="text-white/70">Lignes</span>
          <select id="page-size" class="glass rounded-lg px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40">
            <option>8</option><option selected>16</option><option>32</option><option>64</option>
          </select>
        </label>

        <!-- Export -->
        <button id="dt-export"
                class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium
                       bg-gradient-to-r from-primary to-primary2 text-[#0b1223] hover:shadow-glassHover transition">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M5 20h14" stroke-width="2" stroke-linecap="round"></path>
          </svg>
          Export Excel
        </button>
      </div>
    </header>

    <!-- Desktop/tablet table -->
    <div class="hidden sm:block p-0">
      <div class="overflow-x-auto">
        <table id="data-table" class="data-grid min-w-full text-sm text-left">
          <thead class="sticky top-0 z-10 text-[11px] sm:text-xs uppercase tracking-wide text-white/80 backdrop-blur bg-white/5">
            <tr id="table-head-row"><!-- JS fills --></tr>
          </thead>
          <tbody id="table-body" class="tbody text-white/90"><!-- JS fills --></tbody>
        </table>
      </div>
    </div>

    <!-- Mobile cards -->
    <div id="mobile-cards" class="sm:hidden divide-y divide-white/10"><!-- JS fills --></div>

    <!-- Empty -->
    <div id="empty" class="hidden py-10 text-center text-white/70 text-sm">Aucune donnée disponible.</div>

    <!-- Loader -->
    <div id="loader" class="hidden py-6 flex items-center justify-center">
      <div class="animate-spin rounded-full h-6 w-6 border-2 border-white/30 border-t-white"></div>
      <span class="ml-3 text-white/70 text-sm">Chargement…</span>
    </div>

    <!-- Footer (same pagination style) -->
    <footer class="px-4 sm:px-5 py-3 border-t border-white/10 grid grid-cols-1 sm:grid-cols-3 items-center gap-3">
      <div id="page-info" class="text-xs text-white/70">—</div>
      <div class="justify-self-center flex items-center gap-1">
        <button id="first" class="px-2 py-1 rounded bg-white/10 hover:bg-white/15 text-xs">«</button>
        <button id="prev"  class="px-2 py-1 rounded bg-white/10 hover:bg-white/15 text-xs">‹</button>
        <input id="page-input" type="number" min="1" class="w-14 text-center glass rounded px-2 py-1 text-xs" value="1" />
        <span id="page-total" class="text-xs text-white/70">/ 1</span>
        <button id="next"  class="px-2 py-1 rounded bg-white/10 hover:bg-white/15 text-xs">›</button>
        <button id="last"  class="px-2 py-1 rounded bg-white/10 hover:bg-white/15 text-xs">»</button>
      </div>
      <div id="result-info" class="justify-self-end text-xs text-white/70"></div>
    </footer>
  </section>

  <!-- Row-card design CSS -->
  <style>
    .data-grid{ border-collapse:separate!important; border-spacing:0 10px!important; }
    .data-grid thead tr { border-bottom:1px solid rgba(255,255,255,.08); }
    .data-grid thead th{
      position:sticky; top:0; padding:.7rem .9rem; font-weight:700; letter-spacing:.03em;
      background:linear-gradient(to bottom, rgba(255,255,255,.10), rgba(255,255,255,.05));
      border-bottom:1px solid rgba(255,255,255,.10); text-transform:uppercase; user-select:none;
    }
    .data-grid .tbody tr{
      background:rgba(255,255,255,.04);
      box-shadow:0 1px 0 0 rgba(255,255,255,.06) inset, 0 6px 18px rgba(3,8,20,.25);
      transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .data-grid .tbody tr:hover{
      background:rgba(255,255,255,.06);
      transform:translateY(-1px);
      box-shadow:0 1px 0 0 rgba(255,255,255,.08) inset, 0 10px 24px rgba(3,8,20,.32);
    }
    .data-grid .tbody td{ padding:.7rem .9rem; vertical-align:top; border-top:1px solid rgba(255,255,255,.06); }
    .data-grid .tbody tr td + td{ border-left:1px solid rgba(255,255,255,.03); }
    .data-grid .tbody tr td:first-child{ border-top-left-radius:12px; border-bottom-left-radius:12px; }
    .data-grid .tbody tr td:last-child{ border-top-right-radius:12px; border-bottom-right-radius:12px; }

    .pill{ display:inline-flex; align-items:center; gap:.4rem; padding:.125rem .5rem; border-radius:.5rem; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.08); }
    .vol-cell{ display:grid; gap:.25rem; }
    .vol-bar{ height:.375rem; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; }
    .vol-fill{ height:100%; background:linear-gradient(90deg,#4cc9f0,#00f5d4); width:0%; transition:width .6s ease; }
  </style>

  <!-- Vanilla JS -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      /* ===== Helpers ===== */
      const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      const nfmt = n => new Intl.NumberFormat('fr-FR').format(n);
      const fmtDate = iso => { if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':d.toLocaleDateString('fr-FR'); };

      /* ===== Columns ===== */
      const columns = [
        { key:'dateheurecargaison__date', title:'Date',
          render: d => `<span class="cell-value">${fmtDate(d)}</span>` },
        { key:'frontiere__nomville', title:'Frontière',
          render: d => `<span class="cell-value">${d ? `<span class="pill">${esc(d)}</span>` : '—'}</span>` },
        { key:'declaration', title:'Déclaration',
          render: d => `<span class="cell-value">${d ? `<code class="px-1.5 py-0.5 bg-white/10 rounded text-xs">${esc(d)}</code>` : '—'}</span>` },
        { key:'importateur__nomimportateur', title:'Fournisseur',
          render: d => `<span class="cell-value">${esc(d)||'—'}</span>` },
        { key:'entrepot__nomentrepot', title:'Entrepôt',
          render: d => `<span class="cell-value">${esc(d)||'—'}</span>` },
        { key:'immatriculation', title:'Immatriculation',
          render: d => `<span class="cell-value">${esc(d)||'—'}</span>` },
        { key:'produit__nomproduit', title:'Produit',
          render: d => {
            if (!d) return '<span class="cell-value">—</span>';
            const map = {
              Gasoil:'bg-emerald-500/20 text-emerald-200 border-emerald-400/20',
              Mogas:'bg-sky-500/20 text-sky-200 border-sky-400/20',
              Jet:'bg-fuchsia-500/20 text-fuchsia-200 border-fuchsia-400/20',
              'Pétrole':'bg-amber-500/20 text-amber-200 border-amber-400/20'
            };
            const klass = map[d] || 'bg-white/10 text-white/85 border-white/10';
            return `<span class="cell-value"><span class="pill ${klass}">${esc(d)}</span></span>`;
          } },
        { key:'volume', title:'Vol. déclaré',
          render: d => {
            const v = Number(d || 0); const txt = nfmt(v) + '&nbsp;m³';
            return `<span class="cell-value">
                      <div class="vol-cell" data-volume="${v}">
                        <div class="text-white/90 font-medium tabular-nums">${txt}</div>
                        <div class="vol-bar"><div class="vol-fill"></div></div>
                      </div>
                    </span>`;
          } },
      ];

      /* ===== DOM refs ===== */
      const endpoint = '{% url "responseBrutJournalier" %}';  /* your existing view */
      const headRow  = document.getElementById('table-head-row');
      const tbody    = document.getElementById('table-body');
      const cards    = document.getElementById('mobile-cards');
      const empty    = document.getElementById('empty');
      const loader   = document.getElementById('loader');

      const pageSizeEl = document.getElementById('page-size');
      const searchEl   = document.getElementById('dt-search');
      const exportBtn  = document.getElementById('dt-export');

      // Footer (same style)
      const pageInfo   = document.getElementById('page-info');
      const resultInfo = document.getElementById('result-info');
      const pageInput  = document.getElementById('page-input');
      const pageTotal  = document.getElementById('page-total');
      const btnFirst   = document.getElementById('first');
      const btnPrev    = document.getElementById('prev');
      const btnNext    = document.getElementById('next');
      const btnLast    = document.getElementById('last');

      const toggleBtn  = document.getElementById('colToggleBtn');
      const toggleMenu = document.getElementById('colToggleMenu');

      /* ===== Build head ===== */
      headRow.innerHTML = columns.map((c,i)=>`<th data-col="${i}" class="px-3 py-2">${c.title}</th>`).join('');

      /* ===== Column toggles ===== */
      const visibleCols = new Array(columns.length).fill(true);
      function applyColumnVisibility(){
        Array.from(headRow.children).forEach((th,i)=> th.classList.toggle('hidden', !visibleCols[i]));
        tbody.querySelectorAll('tr').forEach(tr=>{
          Array.from(tr.children).forEach((td,i)=> td.classList.toggle('hidden', !visibleCols[i]));
        });
      }
      function rebuildColumnMenu(){
        if(!toggleMenu) return;
        toggleMenu.innerHTML='';
        columns.forEach((col,idx)=>{
          const item=document.createElement('label');
          item.className='flex items-center gap-2 px-2 py-1.5 rounded hover:bg-white/10 cursor-pointer';
          item.innerHTML=`<input type="checkbox" class="accent-primary" ${visibleCols[idx]?'checked':''} />
                          <span>${col.title}</span>`;
          item.querySelector('input').addEventListener('change',e=>{
            visibleCols[idx]=e.target.checked; applyColumnVisibility();
          });
          toggleMenu.appendChild(item);
        });
      }
      toggleBtn?.addEventListener('click', ()=> toggleMenu.classList.toggle('hidden'));
      document.addEventListener('click', e=>{
        if (!toggleBtn?.contains(e.target) && !toggleMenu?.contains(e.target)) toggleMenu?.classList.add('hidden');
      });
      rebuildColumnMenu();

      /* ===== State (now with total_pages like the other page) ===== */
      const state = { q:"", page:1, page_size:parseInt(pageSizeEl.value,10)||16, total_pages:1, total_filtered:0 };

      /* ===== Utils ===== */
      function buildQuery(extra={}){
        const u = new URLSearchParams();
        u.set('page', state.page);
        u.set('page_size', state.page_size);
        if (state.q) u.set('q', state.q);
        Object.entries(extra).forEach(([k,v])=>u.set(k,v));
        return u.toString();
      }
      function showLoader(on){ loader.classList.toggle('hidden', !on); }

      /* ===== Fetch & render ===== */
      async function loadPage(){
        showLoader(true);
        try{
          const res  = await fetch(`${endpoint}?${buildQuery()}`, { headers:{ 'Accept':'application/json' } });
          if(!res.ok) throw new Error('HTTP '+res.status);
          const json = await res.json();

          // normalize totals for the footer UX
          const rows   = Array.isArray(json) ? json : (json.data || []);
          const total  = json.recordsFiltered ?? json.recordsTotal ?? json.total ?? rows.length;
          state.total_filtered = total;
          state.total_pages    = Math.max(1, Math.ceil((total||1) / state.page_size));

          // Desktop rows
          tbody.innerHTML = rows.map(row=>{
            const tds = columns.map((col,idx)=>{
              const raw = row[col.key];
              const html = col.render ? col.render(raw, row) : `<span class="cell-value">${esc(raw ?? '—')}</span>`;
              return `<td class="px-3 py-2 align-top ${visibleCols[idx] ? '' : 'hidden'}">${html}</td>`;
            }).join('');
            return `<tr>${tds}</tr>`;
          }).join('');

          // Mobile cards
          cards.innerHTML = rows.map(row=>{
            const vol = row['volume']; const volText = (vol || vol === 0) ? nfmt(vol) + ' m³' : '—';
            const decl = row['declaration'] ? `<span class="px-2 py-0.5 rounded-full bg-white/10 text-[11px]">${esc(row['declaration'])}</span>` : '—';
            const prod = row['produit__nomproduit'] ? `<span class="px-2 py-0.5 rounded-full bg-primary/10 text-[11px] text-primary">${esc(row['produit__nomproduit'])}</span>` : '—';

            return `
              <article class="p-4">
                <div>
                  <div class="text-xs text-white/50">Date</div>
                  <div class="text-sm font-semibold">${fmtDate(row['dateheurecargaison__date'])}</div>
                </div>
                <div class="mt-3 grid grid-cols-2 gap-3">
                  <div><div class="text-xs text-white/50">Frontière</div><div class="text-sm">${esc(row['frontiere__nomville'] ?? '—')}</div></div>
                  <div><div class="text-xs text-white/50">Déclaration</div><div class="text-sm">${decl}</div></div>
                  <div><div class="text-xs text-white/50">Fournisseur</div><div class="text-sm">${esc(row['importateur__nomimportateur'] ?? '—')}</div></div>
                  <div><div class="text-xs text-white/50">Entrepôt</div><div class="text-sm">${esc(row['entrepot__nomentrepot'] ?? '—')}</div></div>
                  <div><div class="text-xs text-white/50">Immatriculation</div><div class="text-sm">${esc(row['immatriculation'] ?? '—')}</div></div>
                  <div><div class="text-xs text-white/50">Produit</div><div class="text-sm">${prod}</div></div>
                  <div><div class="text-xs text-white/50">Vol. déclaré</div><div class="text-sm font-semibold">${volText}</div></div>
                </div>
              </article>`;
          }).join('');

          // Volume bars (relative to page)
          const vols = rows.map(r => Number(r.volume || 0));
          const maxV = Math.max(1, ...vols);
          tbody.querySelectorAll('.vol-cell').forEach(cell=>{
            const v = Number(cell.getAttribute('data-volume') || 0);
            const pct = Math.max(4, Math.round((v / maxV) * 100));
            const fill = cell.querySelector('.vol-fill');
            if (fill) fill.style.width = pct + '%';
          });

          renderFooter();
          applyColumnVisibility();
          empty.classList.toggle('hidden', rows.length>0);
        }catch(err){
          console.error(err);
          tbody.innerHTML = '';
          cards.innerHTML = '';
          empty.classList.remove('hidden');
          state.total_filtered = 0; state.total_pages = 1;
          renderFooter();
        }finally{
          showLoader(false);
        }
      }

      /* ===== Footer rendering (same as other page) ===== */
      function renderFooter(){
        const have = state.total_filtered || 0;
        const start = have ? (state.page - 1) * state.page_size + 1 : 0;
        const end   = Math.min(state.page * state.page_size, have);
        pageInfo.textContent   = have ? `Page ${state.page} sur ${state.total_pages}` : '—';
        resultInfo.textContent = have ? `Affichage ${start}–${end} sur ${have}` : 'Aucun résultat';
        pageInput.value = state.page;
        pageTotal.textContent = '/ ' + state.total_pages;

        btnFirst.disabled = btnPrev.disabled = (state.page <= 1);
        btnNext.disabled  = btnLast.disabled = (state.page >= state.total_pages);
        [btnFirst,btnPrev,btnNext,btnLast].forEach(b=>{
          b.classList.toggle('opacity-40', b.disabled);
          b.classList.toggle('cursor-not-allowed', b.disabled);
        });
      }

      /* ===== Events ===== */
      // Search (debounced)
      let t=null;
      searchEl?.addEventListener('input', ()=>{
        clearTimeout(t);
        t=setTimeout(()=>{ state.q = searchEl.value.trim(); state.page=1; loadPage(); }, 300);
      });
      // Page size
      pageSizeEl.addEventListener('change', ()=>{ state.page_size=parseInt(pageSizeEl.value,10)||16; state.page=1; loadPage(); });
      // Pagination buttons
      btnFirst.addEventListener('click', ()=>{ if(state.page>1){ state.page=1; loadPage(); } });
      btnPrev .addEventListener('click', ()=>{ if(state.page>1){ state.page--; loadPage(); } });
      btnNext .addEventListener('click', ()=>{ if(state.page<state.total_pages){ state.page++; loadPage(); } });
      btnLast .addEventListener('click', ()=>{ if(state.page<state.total_pages){ state.page=state.total_pages; loadPage(); } });
      // Direct page input
      pageInput.addEventListener('change', ()=>{
        let p = parseInt(pageInput.value,10);
        if (isNaN(p) || p < 1) p = 1;
        if (p > state.total_pages) p = state.total_pages;
        state.page = p; loadPage();
      });
      // Export
      exportBtn?.addEventListener('click', ()=>{
        const params = new URLSearchParams({ q: state.q, page: state.page, page_size: state.page_size, export: 'excel' });
        window.location.href = `${endpoint}?${params.toString()}`;
      });

      // Initial load
      loadPage();
    });
  </script>
{% endblock %}
