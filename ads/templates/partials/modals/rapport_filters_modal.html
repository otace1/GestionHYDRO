{% load crispy_forms_filters %}
{% load crispy_forms_tags %}
<!-- Rapport Filter Modal -->
<div class="modal fade" id="modal-rapport" tabindex="-1" aria-labelledby="rapportModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form action="{% url 'rapportFiltres' %}" method="post">
      {% csrf_token %}
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="rapportModalLabel">Filtres des rapports</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Fermer">
  <span aria-hidden="true">&times;</span>
</button>
        </div>
        <div class="modal-body">
          {% crispy form %}
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Appliquer</button>
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
        </div>
      </div>
    </form>
  </div>
</div>
