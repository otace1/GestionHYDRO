server {
    listen 80;
    server_name _;
    server_tokens off;


    client_max_body_size 20M;
    large_client_header_buffers 4 16k;  # Add this line

    location / {
        try_files $uri @proxy_api;
    }

    location /admin {
        try_files $uri @proxy_api;
    }

    location @proxy_api {
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://app:8000;  # Changed to 'django' container name
    }

    location /static/ {
        alias /vol/web/static/;
    }

    location /media/ {
        alias /vol/web/media/;
    }
}

